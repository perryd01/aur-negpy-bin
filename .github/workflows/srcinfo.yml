name: .SRCINFO

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  srcinfo:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel@sha256:8745817f349ed24373341ddb92776209eeec3f0364ea48f7f645ac5800d30a50
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm git

      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fix ownership
        run: chown -R builder:builder .

      - name: Regenerate .SRCINFO and compare
        run: |
          sudo -u builder -H makepkg --printsrcinfo > /tmp/.SRCINFO
          diff -u .SRCINFO /tmp/.SRCINFO
